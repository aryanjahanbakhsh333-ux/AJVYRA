<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>AJVYRA Mobile Game</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#07070d;color:#fff;font-family:Arial;touch-action:none}canvas{width:100%;height:100%;display:block}.hud{position:fixed;top:15px;left:15px;font-weight:bold}.btn{position:fixed;width:70px;height:70px;border-radius:18px;border:1px solid #ffffff55;background:#181824dd;color:#fff;font-weight:bold;touch-action:none}.attack{right:22px;bottom:110px}.dash{right:105px;bottom:30px}.action{right:22px;bottom:20px}.pause{right:20px;top:18px;width:52px;height:52px}.joy{position:fixed;left:22px;bottom:28px;width:145px;height:145px;border:2px solid #ffffff35;border-radius:50%;background:#ffffff12}.stick{position:absolute;left:45px;top:45px;width:55px;height:55px;border-radius:50%;background:#ffffff44}</style></head><body><canvas id="c"></canvas><div class="hud">AJVYRA · SCORE <span id="s">0</span> · HP <span id="h">3</span></div><div class="joy" id="j"><div class="stick" id="st"></div></div><button class="btn attack" id="a">⚔ ATTACK</button><button class="btn dash" id="d">💨 DASH</button><button class="btn action" id="x">✨ ACTION</button><button class="btn pause" id="p">Ⅱ</button><script>const c=document.getElementById('c'),g=c.getContext('2d');let W,H,score=0,hp=3,pause=0,last=0,sp=0,bs=[],es=[],joy=0;let P={x:0,y:0,r:18,vx:0,vy:0,cd:0};function size(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);if(!P.x){P.x=W/2;P.y=H/2}}addEventListener('resize',size);size();let K={};onkeydown=e=>K[e.key.toLowerCase()]=1;onkeyup=e=>K[e.key.toLowerCase()]=0;function shoot(){if(pause||P.cd>0)return;P.cd=.2;let q=Math.atan2(H/2-P.y,W/2-P.x);bs.push({x:P.x,y:P.y,vx:Math.cos(q)*650,vy:Math.sin(q)*650,r:5})}function dash(){P.x=Math.max(20,Math.min(W-20,P.x+P.vx*.5));P.y=Math.max(20,Math.min(H-20,P.y+P.vy*.5))}function action(){score+=25}a.onclick=shoot;d.onclick=dash;x.onclick=action;p.onclick=()=>pause=!pause;function spawn(){let q=Math.floor(Math.random()*4),X=q<2?(q?-25:W+25):Math.random()*W,Y=q<2?Math.random()*H:(q==2?-25:H+25);es.push({x:X,y:Y,r:14,v:75+Math.random()*55})}j.onpointerdown=e=>{joy=1;j.setPointerCapture(e.pointerId);move(e)};j.onpointermove=e=>joy&&move(e);j.onpointerup=()=>{joy=0;st.style.left='45px';st.style.top='45px';P.vx=P.vy=0};function move(e){let r=j.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,m=Math.min(48,Math.hypot(dx,dy)),q=Math.atan2(dy,dx);dx=Math.cos(q)*m;dy=Math.sin(q)*m;st.style.left=45+dx+'px';st.style.top=45+dy+'px';P.vx=dx/48*230;P.vy=dy/48*230}function update(dt){if(pause)return;let dx=(K.d||K.arrowright?1:0)-(K.a||K.arrowleft?1:0),dy=(K.s||K.arrowdown?1:0)-(K.w||K.arrowup?1:0);if(dx||dy){let m=Math.hypot(dx,dy);P.vx=dx/m*230;P.vy=dy/m*230}else if(!joy){P.vx*=.8;P.vy*=.8}P.x=Math.max(20,Math.min(W-20,P.x+P.vx*dt));P.y=Math.max(20,Math.min(H-20,P.y+P.vy*dt));P.cd=Math.max(0,P.cd-dt);sp-=dt;if(sp<=0){spawn();sp=.8}bs.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});bs=bs.filter(b=>b.x>-40&&b.x<W+40&&b.y>-40&&b.y<H+40);es.forEach(e=>{let q=Math.atan2(P.y-e.y,P.x-e.x);e.x+=Math.cos(q)*e.v*dt;e.y+=Math.sin(q)*e.v*dt;if(Math.hypot(P.x-e.x,P.y-e.y)<P.r+e.r){hp--;e.x=Math.random()*W;e.y=Math.random()*H;if(hp<=0){hp=3;score=Math.max(0,score-100)}}});for(let i=es.length-1;i>=0;i--)for(let k=bs.length-1;k>=0;k--)if(Math.hypot(es[i].x-bs[k].x,es[i].y-bs[k].y)<es[i].r+bs[k].r){score+=100;es.splice(i,1);bs.splice(k,1);break}s.textContent=score;h.textContent=hp}function draw(){g.clearRect(0,0,W,H);g.strokeStyle='#ffffff10';for(let i=0;i<W;i+=50){g.beginPath();g.moveTo(i,0);g.lineTo(i,H);g.stroke()}for(let i=0;i<H;i+=50){g.beginPath();g.moveTo(0,i);g.lineTo(W,i);g.stroke()}g.fillStyle='#9b1c4b';es.forEach(e=>{g.beginPath();g.arc(e.x,e.y,e.r,0,7);g.fill()});g.fillStyle='#fff';bs.forEach(b=>{g.beginPath();g.arc(b.x,b.y,b.r,0,7);g.fill()});g.beginPath();g.arc(P.x,P.y,P.r,0,7);g.fill()}function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)</script></body></html>
