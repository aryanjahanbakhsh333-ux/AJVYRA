<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>AJVYRA Shot Factory</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
}

header {
    padding: 24px;
    border-bottom: 1px solid #222;
}

h1 {
    margin: 0;
}

#status {
    padding: 24px;
}

.grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
    padding: 24px;
}

.card {
    background: #0c0c0c;
    border: 1px solid #222;
    border-radius: 14px;
    overflow: hidden;
}

.card video {
    width: 100%;
    display: block;
}

.card-info {
    padding: 14px;
}

.genre {
    opacity: .65;
    font-size: 13px;
}

.waiting {
    aspect-ratio: 16 / 9;
    display: grid;
    place-items: center;
    color: #777;
}
</style>
</head>

<body>

<header>
    <h1>AJVYRA — AI SHOT FACTORY</h1>
</header>

<section id="status">
    Loading...
</section>

<section id="shots"
         class="grid">
</section>

<script>

async function load() {

    const response =
        await fetch("/api/shots");

    const data =
        await response.json();

    const shots =
        document.getElementById("shots");

    const status =
        document.getElementById("status");

    status.innerHTML =
        `Total shots: ${data.total}`;

    shots.innerHTML = "";

    for (const shot of data.shots) {

        const card =
            document.createElement("article");

        card.className = "card";

        if (shot.video &&
            shot.status === "ready") {

            card.innerHTML = `
                <video
                    controls
                    preload="metadata"
                    src="/api/shots/${shot.number}/video">
                </video>

                <div class="card-info">
                    <strong>
                        Shot ${String(shot.number)
                            .padStart(3, "0")}
                    </strong>

                    <div class="genre">
                        ${shot.genre}
                    </div>
                </div>
            `;

        } else {

            card.innerHTML = `
                <div class="waiting">
                    GENERATING
                </div>

                <div class="card-info">
                    <strong>
                        Shot ${String(shot.number)
                            .padStart(3, "0")}
                    </strong>

                    <div class="genre">
                        ${shot.genre}
                    </div>
                </div>
            `;
        }

        shots.appendChild(card);
    }
}

load();

setInterval(load, 30000);

</script>

</body>
</html>
